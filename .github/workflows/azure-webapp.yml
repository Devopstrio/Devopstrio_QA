name: Azure Multi Environment CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to Production Environment'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '20'

jobs:

  # ==========================================
  # QA DEPLOYMENT (AUTOMATIC)
  # ==========================================
  deploy-qa:
    name: Deploy QA Environment
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Build application
      - name: Build Application
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Verify build output
      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found."
            exit 1
          fi

          echo "QA build completed successfully."

      # Deploy to QA
      - name: Deploy to QA Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio-QA'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dist

  # ==========================================
  # PRODUCTION DEPLOYMENT (MANUAL)
  # ==========================================
  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true'

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Build application
      - name: Build Application
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Verify build output
      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found."
            exit 1
          fi

          echo "Production build completed successfully."

      # Deploy to Production
      - name: Deploy to Production Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./dist
