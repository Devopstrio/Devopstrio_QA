# Improved Azure Multi Environment CI/CD Workflow

name: Azure Multi Environment CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to Production'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '20'

jobs:

  # =====================================================
  # QA DEPLOYMENT (AUTO)
  # =====================================================
  deploy-qa:
    name: Deploy QA Environment
    runs-on: ubuntu-latest

    # Auto deploy only on push
    if: github.event_name == 'push'

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # SETUP NODE
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # =====================================================
      # BUILD APPLICATION
      # =====================================================
      - name: Build Application
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # =====================================================
      # VERIFY BUILD OUTPUT
      # =====================================================
      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found"
            exit 1
          fi

          echo "Build successful"
          echo "Dist folder contents:"
          ls -lah dist

      # =====================================================
      # CHECK DIST SIZE
      # =====================================================
      - name: Check Dist Folder Size
        run: |
          echo "Checking dist folder size..."
          du -sh dist

      # =====================================================
      # VERIFY QA SECRET
      # =====================================================
      - name: Verify QA Secret
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}" ]; then
            echo "ERROR: QA Publish Profile Secret Missing"
            exit 1
          else
            echo "QA Publish Profile Secret Found"
          fi

      # =====================================================
      # DEPLOY TO QA
      # =====================================================
      - name: Deploy to QA Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio-QA'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          package: ./dist
          clean: true

  # =====================================================
  # PRODUCTION DEPLOYMENT (MANUAL)
  # =====================================================
  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest

    # Manual deployment only
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true'

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # SETUP NODE
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # =====================================================
      # BUILD APPLICATION
      # =====================================================
      - name: Build Application
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # =====================================================
      # VERIFY BUILD OUTPUT
      # =====================================================
      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found"
            exit 1
          fi

          echo "Production build successful"
          echo "Dist folder contents:"
          ls -lah dist

      # =====================================================
      # CHECK DIST SIZE
      # =====================================================
      - name: Check Dist Folder Size
        run: |
          echo "Checking dist folder size..."
          du -sh dist

      # =====================================================
      # VERIFY PRODUCTION SECRET
      # =====================================================
      - name: Verify Production Secret
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}" ]; then
            echo "ERROR: Production Publish Profile Secret Missing"
            exit 1
          else
            echo "Production Publish Profile Secret Found"
          fi

      # =====================================================
      # DEPLOY TO PRODUCTION
      # =====================================================
      - name: Deploy to Production Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio-prod'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./dist
          clean: true
