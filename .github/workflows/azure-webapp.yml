name: Azure Enterprise Multi Environment CI/CD

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'

jobs:

  # ==================================================
  # BUILD APPLICATION
  # ==================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install Dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Build Application
      - name: Build Vite Application
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Verify Dist
      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found."
            exit 1
          fi

          echo "Build completed successfully."

      # Compress Build
      - name: Compress Build Files
        run: |
          cd dist
          zip -r ../release.zip .

      # Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-production-build
          path: release.zip

  # ==================================================
  # DEPLOY QA
  # ==================================================
  deploy-qa:
    name: Deploy QA Environment
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: qa
      url: https://devopstrio-qa.azurewebsites.net

    steps:

      # Download Artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-production-build

      # Extract Artifact
      - name: Extract Build Files
        run: unzip release.zip -d dist

      # Deploy QA
      - name: Deploy to QA Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio-qa'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          package: ./dist
          clean: true

  # ==================================================
  # DEPLOY PRODUCTION
  # ==================================================
  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest
    needs: deploy-qa

    environment:
      name: production
      url: https://devopstrio.co.uk

    steps:

      # Download Artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-production-build

      # Extract Artifact
      - name: Extract Build Files
        run: unzip release.zip -d dist

      # Deploy Production
      - name: Deploy to Production Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./dist
          clean: true
