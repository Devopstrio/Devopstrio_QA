name: Azure React Vite CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: 'devopstrio-QA'

jobs:
  build-and-deploy:
    name: Build and Deploy React Application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Verify installed packages
      - name: Verify Dependencies
        run: npm list --depth=0

      # Build Vite application
      - name: Build Application
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Validate build output
      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found."
            exit 1
          fi

          echo "Build completed successfully."
          ls -la dist

      # Deploy only production build files
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dist

      # Success log
      - name: Deployment Success
        if: success()
        run: |
          echo "================================="
          echo "Azure Deployment Successful"
          echo "Application deployed successfully"
          echo "================================="

      # Failure log
      - name: Deployment Failure Alert
        if: failure()
        run: |
          echo "================================="
          echo "Azure Deployment Failed"
          echo "Check GitHub Actions logs"
          echo "Verify Azure publish profile"
          echo "Verify build output"
          echo "================================="
          exit 1
