name: Azure Multi Environment CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to Production'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '20'

jobs:

  # =====================================================
  # QA DEPLOYMENT
  # =====================================================

  deploy-qa:
    name: Deploy QA Environment
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE SETUP
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # =====================================================
      # BUILD PROJECT
      # =====================================================

      - name: Build Project
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # =====================================================
      # VERIFY DIST
      # =====================================================

      - name: Verify Dist Folder
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found"
            exit 1
          fi

          echo "Dist folder found"
          ls -lah dist

      # =====================================================
      # SHOW DIST SIZE
      # =====================================================

      - name: Check Dist Size
        run: du -sh dist

      # =====================================================
      # VERIFY QA SECRET
      # =====================================================

      - name: Verify QA Secret
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}" ]; then
            echo "ERROR: QA Publish Profile Secret Missing"
            exit 1
          else
            echo "QA Publish Profile Secret Found"
          fi

      # =====================================================
      # INSTALL ARCHIVER
      # =====================================================

      - name: Install Archiver
        run: npm install archiver --save-dev

      # =====================================================
      # COMPRESS DIST
      # =====================================================

      - name: Compress Dist Folder
        run: npm run compress

      # =====================================================
      # CHECK ZIP SIZE
      # =====================================================

      - name: Check ZIP Size
        run: ls -lh dist.zip

      # =====================================================
      # DEPLOY TO QA
      # =====================================================

      - name: Deploy to QA Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio-QA'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          package: dist.zip
          clean: true

  # =====================================================
  # PRODUCTION DEPLOYMENT
  # =====================================================

  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true'

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE SETUP
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # =====================================================
      # BUILD PROJECT
      # =====================================================

      - name: Build Project
        env:
          VITE_FORM_SUBMIT_EMAIL: ${{ secrets.VITE_FORM_SUBMIT_EMAIL }}
          VITE_COMPANY_ID: ${{ secrets.VITE_COMPANY_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # =====================================================
      # VERIFY DIST
      # =====================================================

      - name: Verify Dist Folder
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found"
            exit 1
          fi

          echo "Dist folder found"
          ls -lah dist

      # =====================================================
      # SHOW DIST SIZE
      # =====================================================

      - name: Check Dist Size
        run: du -sh dist

      # =====================================================
      # VERIFY PRODUCTION SECRET
      # =====================================================

      - name: Verify Production Secret
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}" ]; then
            echo "ERROR: Production Publish Profile Secret Missing"
            exit 1
          else
            echo "Production Publish Profile Secret Found"
          fi

      # =====================================================
      # INSTALL ARCHIVER
      # =====================================================

      - name: Install Archiver
        run: npm install archiver --save-dev

      # =====================================================
      # COMPRESS DIST
      # =====================================================

      - name: Compress Dist Folder
        run: npm run compress

      # =====================================================
      # CHECK ZIP SIZE
      # =====================================================

      - name: Check ZIP Size
        run: ls -lh dist.zip

      # =====================================================
      # DEPLOY TO PRODUCTION
      # =====================================================

      - name: Deploy to Production Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devopstrio-prod'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: dist.zip
          clean: true